# openwrath config — EXAMPLE ONLY.
#
# Your real config lives at  ~/.config/openwrath/config.toml  and is written for you by
# `openwrath init` (guided) or `openwrath detect` (auto only). You normally never touch it by
# hand — re-run `init`/`detect` to refresh.
#
# Every value below is a path on YOUR machine. openwrath hardcodes no paths and ships no
# game data: the auto-detected paths come from your Steam/Proton install, and the
# bring-your-own paths point at files you legally own.
#
# Fastest start:   modkit/openwrath init      # detects, confirms, and fills this in for you.

[paths]
# --- auto-detected by `openwrath init` / `detect` (from your Steam / Proton layout) ---
# On WSL these come from the Windows side: Steam under /mnt/c/Program Files (x86)/Steam, the install
# under steamapps/common/, and the Mods dir in /mnt/c/Users/<you>/Documents/...  (no Wine prefix).
steam_root     = "/path/to/Steam"
game_install   = "/path/to/steamapps/common/Command and Conquer 3 - Kane's Wrath"
prefix         = "/path/to/steamapps/compatdata/24810/pfx"   # empty under WSL (native Windows app)
mods_dir       = "/path/to/pfx/drive_c/users/steamuser/Documents/Command & Conquer 3 Kane's Wrath/Mods"
install_skudef = "/path/to/game_install/CNC3EP1_english_1.3.SkuDef"
openwrath      = "/path/to/openwrath-toolchain"

# --- bring-your-own (point these at your own legally-owned files) ---
# `openwrath init` searches for these and offers what it finds; the last two can also be PRODUCED:
#   base_manifests -> `openwrath extract-manifests`   (from your installed game's .big archives)
#   stringhashes   -> `openwrath gen-stringhashes`    (compiled from your own sdk + schema)
# Generated outputs default to ~/.local/share/openwrath/ (XDG) and are written back here for you.
sdk            = "/path/to/KanesWrathXMLFiles"
base_manifests = "/path/to/base-manifests"     # or ~/.local/share/openwrath/base-manifests
schema         = "/path/to/CnC3Types.xsd"
stringhashes   = "/path/to/StringHashes.xml"   # generated from YOUR sdk; EA-derived, never shipped
